<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perception Evidence</title>
<style>
  :root{color-scheme:light;--ink:#172d40;--muted:#607486;--line:#e1e8ed;--teal:#117d78;--wash:#edf6f5;--amber:#a75d15;--red:#b04443;--paper:#fff;--bg:#f3f6f8}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 "Segoe UI",sans-serif}
  button,input,select{font:inherit}button{cursor:pointer}a{color:var(--teal);text-decoration:none}
  button,.button{border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:8px 12px}
  button:hover,.button:hover{border-color:var(--teal)}:focus-visible{outline:3px solid #61bab4;outline-offset:3px}
  .layout{display:grid;grid-template-columns:206px minmax(0,1fr);min-height:100vh}
  aside{background:#122b3c;color:#d6e1e6;padding:28px 18px;position:sticky;top:0;height:100vh}
  .brand{font-size:13px;letter-spacing:.14em;font-weight:700;color:white;margin:0 8px 7px}.brand-sub{font-size:11px;color:#8faab8;margin:0 8px 34px}
  aside a{display:block;color:#b7cbd5;padding:12px;border-radius:7px;margin-bottom:5px}aside a.active{background:#234857;color:white;border-left:3px solid #69cec0}
  .side-note{font-size:11px;line-height:1.7;color:#8faab8;margin:35px 10px}
  main{min-width:0;max-width:1600px;padding:28px 34px 40px;width:100%;margin:auto}
  .top,.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .eyebrow{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
  h1{font-size:29px;letter-spacing:-.7px;margin:4px 0 3px}h2{font-size:19px;margin:0 0 6px;letter-spacing:-.3px}h3{font-size:15px;margin:0 0 7px}
  p{margin:5px 0 12px}.muted,.small{color:var(--muted)}.small{font-size:12px}.micro{font-size:10px;color:var(--muted)}
  .snapshot{font-size:11px;color:var(--muted);padding:13px 0 19px}
  .panel{background:white;border:1px solid var(--line);border-radius:11px;padding:22px;margin-bottom:20px;min-width:0}
  .hero{background:linear-gradient(120deg,#e7f3f1,#f7fbfa);border-color:#cfe3df;padding:26px}
  .hero h2{font-size:26px;line-height:1.25;max-width:900px;margin:10px 0 14px}
  .summary{font-size:14px;line-height:1.8;max-width:1000px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .pill{display:inline-block;font-size:11px;padding:3px 8px;border:1px solid #d6e2e6;border-radius:5px;background:#f7fafb;margin:2px 4px 2px 0;overflow-wrap:anywhere}
  .good{background:#e8f4ee;color:#256650;border-color:#cce4d7}.warn{background:#fbf1e5;color:#92531d;border-color:#efddc7}.bad{background:#faeceb;color:#9f3d3b;border-color:#ebd0ce}
  .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}
  .metric{background:white;border:1px solid var(--line);border-radius:9px;padding:16px 18px}.metric strong{display:block;font-size:29px;line-height:1.2;margin:5px 0}.metric .label{font-size:12px;color:var(--muted)}
  .columns{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(260px,1fr);gap:20px;align-items:start}.columns>div{min-width:0}
  .chips{margin:10px 0}.source{padding:0;border:0;background:none;color:var(--teal);font-size:12px;text-align:left}
  .source:hover{text-decoration:underline}.link{border:0;background:none;color:var(--teal);padding:0;text-align:left;font-weight:600}
  .flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:15px}.flow div{border-top:3px solid #c7d4dc;padding-top:9px;font-size:12px}.flow div:first-child,.flow div:nth-child(2){border-color:var(--teal)}
  .flow strong{display:block;margin-bottom:4px}.flow span{color:var(--muted);font-size:11px}
  .scroll{overflow-x:auto;min-width:0}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;background:#f7f9fa;color:var(--muted)}
  th,td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}.behaviours td:first-child{min-width:155px}.behaviours td:nth-child(2){min-width:260px}
  .behaviours details{max-width:650px}.behaviours summary{font-size:12px;color:var(--teal);cursor:pointer}.behaviours details p{margin:8px 0}
  .action{border-bottom:1px solid var(--line);padding:13px 0}.action:last-child{border-bottom:0}.action p{font-size:12px;margin:6px 0;line-height:1.7}
  .hash{font:11px/1.7 Consolas,monospace;word-break:break-all;color:#35556b}.indicator{padding:14px 0;border-bottom:1px solid var(--line)}.indicator:last-child{border:0}
  .filters{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}.filters input[type=search]{flex:1;min-width:200px}
  .filters label{min-width:0;max-width:100%}.filters select{min-width:0;max-width:100%;flex:1}
  .action,.small,.summary{overflow-wrap:anywhere}
  input,select{padding:8px 10px;border:1px solid #cdd8df;border-radius:6px;background:white;color:var(--ink)}label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}
  #campaign-picker label{min-width:0;max-width:100%}#campaign{min-width:0;width:460px;max-width:100%;flex:1}
  .stack{height:15px;border-radius:4px;overflow:hidden;display:flex;margin:18px 0 12px}.stack span{display:block}
  .legend{display:flex;gap:15px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
  .timeline{display:flex;gap:5px;overflow-x:auto;padding:12px 0}.timeline button{min-width:25px;flex:1;height:35px;padding:0;border-radius:4px;color:white;font-size:10px;border:0}
  .presence th{position:sticky;top:0;white-space:nowrap}.presence th:first-child{min-width:110px}.presence td{padding:5px;vertical-align:middle;text-align:center}
  .presence td:first-child{text-align:left;font-size:12px;white-space:nowrap}.presence button{width:28px;height:23px;padding:0;border-radius:3px;border:0;background:#edf1f4;color:#93a4b0}
  .presence button.present{background:#318f89;color:white}.presence .count{font-size:10px;color:var(--muted);margin-left:7px}
  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.compare-box{padding:15px;border:1px solid var(--line);border-radius:7px}
  .empty{padding:28px;background:#f8fafb;border-radius:7px;color:var(--muted)}
  .note{font-size:12px;color:var(--muted);padding:0 2px;margin:0 0 20px}
  dialog{border:1px solid var(--line);border-radius:12px;max-width:1100px;width:calc(100vw - 34px);max-height:90vh;padding:0;box-shadow:0 25px 90px #122b3c33;color:var(--ink)}
  dialog::backdrop{background:#102b3d80}.reader-head{position:sticky;top:0;z-index:1;padding:18px 22px;background:white;border-bottom:1px solid var(--line)}
  .reader-body{padding:22px;overflow-wrap:anywhere}.reader-body pre{background:#f3f6f8;white-space:pre-wrap;padding:15px;font:12px/1.6 Consolas,monospace;border-radius:6px}
  .reader-body table{font-size:12px}.reader-body h3{font-size:20px;margin-top:24px}.reader-body h4{font-size:16px;margin-top:18px}.reader-body p{line-height:1.8}
  .highlight{background:#fff1cc!important;outline:2px solid #ddba65}.reader-state{padding:14px;background:#f0f6f7;border-radius:7px;margin-bottom:16px}
  .reader-actions{margin-top:10px}.reader-actions select{max-width:100%}
  [hidden]{display:none!important}
  .loop-view{--ink:#24292f;--muted:#4d5661}
  .loop-table{min-width:1180px}.loop-table td{font-size:12px}.loop-table th{white-space:nowrap}
  .loop-table td:first-child{min-width:210px;max-width:300px}.loop-table .link{color:#263f43}
  .loop-stage{display:block;padding:7px 9px;border:1px solid #dce3e8;border-radius:7px;background:#f4f6f8;color:#414d58;font-size:11px;white-space:nowrap}
  .loop-stage.review{border-color:#c2d9d2;background:#edf6f2;color:#255646}
  .loop-detail{scroll-margin-top:16px}.loop-stage-detail{padding:15px 0;border-top:1px solid var(--line)}
  .loop-stage-detail .source{display:block;margin:8px 0;overflow-wrap:anywhere}
  figure.loop-model{margin:0 0 20px}
  .loop-model figcaption p{color:var(--muted);font-size:12px}
  .loop-coordination{border:1px solid #d8cde9;border-radius:8px;background:#f5f1fa;padding:14px 16px;margin:18px 0;color:#483266}
  .loop-coordination strong{display:block;margin-bottom:4px}.loop-coordination p{margin:0;font-size:12px}
  .loop-model-track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:20px;list-style:none;padding:0;margin:0}
  .loop-model-node{position:relative;min-width:0;border:1px solid #ccdae5;border-top:4px solid #326482;border-radius:8px;padding:12px;background:#f6f9fc;overflow-wrap:anywhere}
  .loop-model-node.human{border-color:#d8cde9;border-top-color:#72529a;background:#f8f5fc}
  .loop-model-node:not(:last-child)::after{content:"";position:absolute;right:-15px;top:32px;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:7px solid #596b7a}
  .loop-model-role{font-size:10px;color:#405367;min-height:32px}
  .loop-model-node.human .loop-model-role{color:#583b78}
  .loop-model-node h3{font-size:15px;margin:5px 0 8px}.loop-model-target{font-size:12px;min-height:76px;margin:0 0 12px}
  .loop-model-evidence{border-top:1px dashed #bdcad4;padding-top:10px;font-size:11px;color:#414d58}
  .loop-model-evidence strong,.loop-model-evidence span{display:block}.loop-model-evidence strong{margin:5px 0}
  .loop-model-evidence.review{color:#255646}.loop-model-evidence.review strong{background:#e8f4ee;border-radius:5px;padding:5px 6px}
  .loop-feedback{position:relative;margin:18px 6% 16px;padding:10px 14px;border:2px solid #596b7a;border-top:0;border-radius:0 0 12px 12px;text-align:center;font-size:12px;color:#344653}
  .loop-feedback::before{content:"";position:absolute;left:-5px;top:-3px;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid #596b7a}
  .loop-model-changes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}
  .loop-model-change{padding:12px;border:1px solid var(--line);border-radius:8px}.loop-model-change strong{display:block;font-size:12px;margin-bottom:5px}.loop-model-change p{font-size:12px;color:var(--muted);margin:0}
  .loop-model-validation{padding:12px 14px;background:#f4f6f8;border-radius:7px;font-size:12px;color:#414d58}
  .loop-playbook-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px;align-items:start}
  .loop-playbook{min-width:0;overflow-wrap:anywhere;border:1px solid #c8dff1;border-radius:12px;background:#f0f7fd;overflow:hidden}
  .loop-playbook h3{margin:0;padding:18px 14px;background:#075d98;color:#fff;font-size:19px}
  .loop-playbook:nth-child(even) h3{background:#0078c5}.loop-playbook:last-child h3{background:#60328c}
  .loop-playbook-body{padding:16px}.loop-playbook-body>p{margin:0 0 14px;line-height:1.7}
  .loop-mapped-agent{border:1px solid #d9e4ed;border-radius:10px;background:#fff;margin:10px 0;overflow:hidden}
  .loop-mapped-agent>summary{padding:12px 14px;cursor:pointer;font-size:12px;color:#25465e}
  .loop-mapped-agent>summary strong{font-size:13px}.loop-mapped-agent>summary span{display:block;margin:4px 0 0 14px}
  .loop-agent-status{font-size:11px;color:#4c647a}.loop-mapped-agent[open]>summary{background:#eff5fb;border-bottom:1px solid #d9e4ed}
  .loop-mapped-agent>p,.loop-mapped-agent>.loop-agent-id{margin:12px 14px;display:block}
  .loop-agent-id{font:10px/1.7 Consolas,monospace;overflow-wrap:anywhere;color:#53677a}
  .loop-agent-run{border-top:1px solid #e1e8ef;margin:12px 14px;padding-top:12px;font-size:11px}
  .loop-agent-run .source,.loop-catalog-item .source{display:block;margin-top:7px;text-align:left;overflow-wrap:anywhere;white-space:normal}
  .loop-catalog-detail{margin:12px 0;font-size:12px}.loop-catalog-detail>summary{cursor:pointer;color:#345974;font-weight:600}
  .loop-catalog-item{padding:12px 0;border-bottom:1px solid #e1e8ef}.loop-catalog-item>strong,.loop-catalog-item>code{display:block}.loop-catalog-item>code{font-size:10px;overflow-wrap:anywhere}
  @media(max-width:1250px){.loop-playbook-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:700px){.loop-playbook-grid{grid-template-columns:1fr}}
  figure.loop-demo-sankey{margin:0 0 20px;border:2px solid #c79c43}
  .loop-demo-banner{padding:11px 14px;border-radius:7px;background:#fff3d8;color:#624408;font-weight:700;margin-bottom:14px}
  .loop-demo-sankey figcaption p,.loop-demo-sankey>p{font-size:12px;color:#4d5661}
  .loop-demo-scroll{overflow-x:auto;max-width:100%;margin:12px 0}
  .loop-demo-svg{display:block;width:100%;min-width:1100px;height:auto;font-family:"Segoe UI",sans-serif}
  .loop-demo-svg text{fill:#24292f;font-size:13px}.loop-demo-svg .demo-stage-label{font-size:16px;font-weight:600}
  .loop-demo-svg .demo-watermark{font-size:64px;font-weight:700;fill:#77581c;opacity:.12}
  .loop-demo-legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px}
  .loop-demo-legend span{display:flex;align-items:center;gap:7px}.loop-demo-legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
  .loop-demo-responses{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:16px 0}
  .loop-demo-response{padding:12px;border:1px solid #dce2e8;border-top:4px solid #167d8d;border-radius:7px;background:#f5fafb}
  .loop-demo-response h3{font-size:14px;margin:0 0 8px}.loop-demo-response p{font-size:12px;margin:0;color:#4d5661}
  .loop-demo-sankey details{margin:14px 0;font-size:12px}.loop-demo-sankey summary{cursor:pointer;font-weight:600}
  .loop-demo-end{padding:10px 12px;background:#f4f6f8;border-radius:7px;font-weight:600}
  @media(max-width:1100px){.loop-model-track{grid-template-columns:1fr}.loop-model-node{display:grid;grid-template-columns:minmax(90px,1fr) minmax(0,2fr);column-gap:14px}.loop-model-role{grid-column:1;min-height:0}.loop-model-node h3{grid-column:1;grid-row:2}.loop-model-target{grid-column:2;grid-row:1 / 3;min-height:0;margin:0}.loop-model-evidence{grid-column:1 / -1;margin-top:10px}.loop-model-node:not(:last-child)::after{right:auto;left:22px;top:auto;bottom:-15px;transform:rotate(90deg)}.loop-model-changes{grid-template-columns:1fr}.loop-feedback{margin:18px 0}}
  #loop-count{color:var(--muted);font-size:12px}
  @media(max-width:1200px){main{padding:24px}.layout{grid-template-columns:180px minmax(0,1fr)}.columns{grid-template-columns:1fr}.flow{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:700px){.layout{display:block}aside{position:static;height:auto;padding:15px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.brand{margin:0 12px 0 0}.brand-sub,.side-note{display:none}aside a{font-size:12px;padding:7px;margin:0}main{padding:16px}.top{align-items:flex-start}h1{font-size:25px}.hero h2{font-size:22px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:12px}.panel{padding:17px}.compare-grid{grid-template-columns:1fr}.filters input[type=search]{min-width:0;width:100%}.hero{padding:20px}}
</style>
</head>
<body>
<div class="layout">
  <aside aria-label="Evidence experiences">
    <div><div class="brand">PERCEPTION</div><div class="brand-sub">EVIDENCE WORKSPACE</div></div>
    <a href="/threat-protection" id="briefing-nav">Operational Briefing</a>
    <a href="/assurance-freshness" id="quality-nav">Run Quality</a>
    <a href="/operational-loops" id="loops-nav">Operational Loops &amp; Outcomes</a>
    <a href="/systemic-threat-signals" id="systemic-nav">Systemic Threat Signals</a>
    <a href="/agent-behavior" id="behavior-nav">Agent Behavior Analysis</a>
    <a href="/" id="environment-nav">Environment explorer</a>
    <div class="side-note">Built from collected sessions and report text.<br><br>Intelligence is not the same as verified protection.</div>
  </aside>
  <main>
    <div class="top"><div><div class="eyebrow">From the actual evidence</div><h1 id="page-title"></h1><p class="muted" id="page-subtitle"></p></div><button id="export">Export findings</button></div>
    <div class="snapshot" id="snapshot"></div>
    <div class="filters" id="operational-filters">
      <label>Workflow <select id="workflow"><option value="">All workflows</option></select></label>
      <label>Agent <select id="agent"><option value="">All agents</option></select></label>
      <label>Run started <select id="period"><option value="">All retained time</option><option value="1">Last 24 hours</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></select></label>
      <label>Outcome <select id="outcome"><option value="">All outcomes</option><option value="attention">Needs attention</option><option value="completed">API completed</option><option value="pending">In progress / queued</option><option value="failed">Failed / cancelled</option><option value="evidence">Readable evidence collected</option></select></label>
    </div>
    <div class="filters" id="campaign-picker"><label>Incident / input <select id="campaign"><option value="">All incidents and inputs</option></select></label><span class="small" id="group-note"></span></div>
    <div class="filters" id="signal-filters" hidden>
      <label>Search connections <input type="search" id="signal-search" placeholder="Entity, hypothesis or evidence"></label>
      <label>Show <select id="signal-kind"><option value="">All connections</option><option value="correlations">Factual correlations</option><option value="hypotheses">Reviewable hypotheses</option></select></label>
    </div>
    <div class="filters" id="loop-filters" hidden>
      <label>Search evidence groups <input type="search" id="loop-search" placeholder="Group, incident, workflow or input"></label>
      <label>Possible entry flow <select id="loop-flow"><option value="">All flows</option><option value="alert-led">Alert-led</option><option value="threat-led">Threat-led</option><option value="exposure-led">Exposure-led</option><option value="hunt-led">Hunt-led</option><option value="validation-led">Validation-led</option><option value="mixed">Mixed / uncertain</option><option value="unclassified">Unclassified</option></select></label>
      <label>Evidence <select id="loop-evidence"><option value="">All groups</option><option value="mapped">Mapped artifacts to review</option><option value="unmapped">No mapped artifact evidence</option><option value="gaps">Collection gaps</option><option value="explicit">Explicit loop IDs</option></select></label>
      <span id="loop-count" role="status"></span>
    </div>
    <div id="content"></div>
    <p class="note" id="scope-note"></p>
  </main>
</div>
<dialog id="reader" aria-labelledby="reader-title">
  <div class="reader-head"><div class="row"><h2 id="reader-title"></h2><button id="reader-close">Close evidence</button></div><div class="small" id="reader-meta"></div><div class="reader-actions"><label>Collected artifact <select id="reader-artifact"></select></label></div></div>
  <div class="reader-body" id="reader-body"></div>
</dialog>
<script>
'use strict';
const payload=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob('__SNAPSHOT_PAYLOAD__'),c=>c.charCodeAt(0))));
const insights=payload.report.snapshotInsights;
const quality=payload.experience==='quality';
const systemic=payload.experience==='systemic';
const loops=payload.experience==='loops';
const $=id=>document.getElementById(id);
const labels={report:'Full intelligence report','source-unavailable':'Source unavailable','output-missing':'Detailed output missing',pending:'Not finished',failed:'Failed','collection-issue':'Collection issue','summary-only':'Summary collected','other-output':'Workflow artifact','messages-only':'Agent messages only','no-output':'No collected output'};
const colors={report:'#268d80','source-unavailable':'#c18b43','output-missing':'#b45e54',pending:'#8799a8',failed:'#ae4545','collection-issue':'#ae4545','summary-only':'#8176a1','other-output':'#5b819e','messages-only':'#607d8b','no-output':'#a3adb5'};
const sessions=new Map(insights.sessions.map(s=>[s.id,s]));
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
function plain(text){return String(text||'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/[`*]/g,'').trim();}
function date(value){return value?new Date(value).toLocaleString():'Not supplied';}
function time(value){return new Date(value).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});}
function pill(text,cls){return node('span',text,'pill '+(cls||''));}
function panel(title,sub){const el=node('section',undefined,'panel');if(title)el.append(node('h2',title));if(sub)el.append(node('p',sub,'small'));return el;}
function sourceButton(sessionId,path,line,label){const b=node('button',label||'View source','source');b.onclick=()=>openEvidence(sessionId,path,line);return b;}
function metric(label,value,detail){const el=node('div',undefined,'metric');el.append(node('span',label,'label'),node('strong',String(value)),node('div',detail,'micro'));return el;}
function download(value,name){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=node('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function badge(state){return pill(labels[state],state==='report'?'good':['source-unavailable','pending','summary-only'].includes(state)?'warn':['output-missing','failed','collection-issue'].includes(state)?'bad':'');}
let selected=null;
let selectedGroup=null;
let readerRun=null;
function renderSource(text,line){
  const body=$('reader-body'),lines=String(text).split(/\r?\n/);let code=null,table=null,tableBody=null;
  for(let i=0;i<lines.length;i++){
    const raw=lines[i],number=i+1;let el;

function loopStageCoverage(groups,stageId){
  const counts={review:0,notObserved:0,notAssessed:0,total:groups.length};
  for(const group of groups){
    const stage=group.coverage.find(item=>item.stageId===stageId);
    if(stage.status==='evidence-to-review')counts.review++;

  return counts;
}

function loopAgentKey(name){return typeof name==='string'?name.replace(/^Global\.(?=Microsoft\.Defender\.)/,''):'';}
function loopMappedFlows(catalog){
  const definitions=[
    {id:'alert-led',title:'Alert-led',playbooks:['triage-security-copilot','investigate-incident'],roles:['OutcomeAssuranceAgent'],note:'Triage and investigation dependencies come from the catalog. Outcome Assurance is mapped to resolution checking as an operating role.'},
    {id:'threat-led',title:'Threat-led',playbooks:['analyze-article','proactive-protection'],roles:[],note:'Threat-intelligence and proactive-protection dependencies come directly from the catalog.'},
    {id:'exposure-led',title:'Exposure-led',playbooks:['run-reconnaissance','prioritize-posture','assess-identity-risk','find-fix-web-app-security-risks','pr-mfa'],roles:['OutcomeAssuranceAgent'],note:'Exposure, posture and identity dependencies come from the catalog. Outcome Assurance is mapped to follow-up checking.'},
    {id:'hunt-led',title:'Hunt-led',playbooks:[],roles:['InvestigationAgent','DetectionAuthoringAgent','ReconAgent'],note:'Role-based mapping to registered agents; no dedicated hunt playbook is assumed. Agent activity alone does not establish a hunt.'},
    {id:'validation-led',title:'Validation-led',playbooks:[],roles:['OutcomeAssuranceAgent','ReconAgent','WebAppRedAgent'],note:'Role-based mapping for reassessment, not evidence of verification. Active testing requires explicit authorization; no schedule or approval is inferred.'}
  ];
  return definitions.map(flow=>{
    const playbooks=catalog.playbooks.filter(item=>flow.playbooks.includes(item.id)),references=new Map();
    for(const playbook of playbooks)for(const name of playbook.agentDefinitions){
      const key=loopAgentKey(name);if(!references.has(key))references.set(key,{key,playbooks:[],role:false});
      references.get(key).playbooks.push(playbook.displayName);
    }
    for(const name of flow.roles){
      const key='Microsoft.Defender.'+name;if(!references.has(key))references.set(key,{key,playbooks:[],role:false});
      references.get(key).role=true;
    }
    const agents=[...references.values()].map(reference=>{
      const instances=catalog.agents.filter(agent=>loopAgentKey(agent.definitionName)===reference.key);
      return {...reference,instances,name:instances[0]?.displayName||reference.key,
        status:!instances.length?'Not in saved registry':instances.some(agent=>agent.enabled===true)?'Enabled in saved registry':
          instances.every(agent=>agent.enabled===false)?'Disabled in saved registry':'Registry state unknown'};
    });
    return {...flow,playbooks,agents};
  });
}

    ['Flag, investigate, act and recheck','Flagged items enter deeper investigation and policy-governed follow-up. Of 15 human-led actions, 3 fail and need review; 12 return to agentic rechecking. The early-response path bypasses later human-led stages, not policy or approval requirements; action success alone is not verified resolution.']
  ]){const card=node('section',undefined,'loop-demo-response');card.append(node('h3',title),node('p',description));responses.append(card);}
  figure.append(legend,responses,node('p','Agentic checking across all items is a proposed responsibility in this target model, not observed or implemented orchestration in this report. Defender examples are illustrative, not a claim that automation is enabled or supported for every tenant, entity or action. Actual responses depend on product capabilities, configuration, permissions and required approvals. Downstream bands are intentionally thin and use the same linear scale. Verified closure and selected learning are separate branches. Routine evidence retention is not an explicit learning workflow. Waiting is not failure, and a checked no-action disposition or investigation closure is not proof of risk reduction. This is one fictional alert-led route, not a mandatory sequence. No queue duration, cost saving or real outcome is asserted.'));
  const details=node('details'),summary=node('summary','View fictional flow counts (demo only)'),table=node('table'),head=node('thead'),row=node('tr');
  for(const label of ['From (demo)','To (demo)','Fictional work items'])row.append(node('th',label));
  head.append(row);table.append(head);const body=node('tbody');
  for(const link of data.links){const row=node('tr');row.append(node('td',index.get(link.source).label),node('td',index.get(link.target).label),node('td',String(link.value)));body.append(row);}
  table.append(body);details.append(summary,table);figure.append(details,node('p','END OF DEMO - real snapshot evidence resumes below. The fictional Sankey does not alter any evidence or outcome metric.','loop-demo-end'));
  return figure;
}
function renderLoopDetail(group){
  const model=payload.report.operationalLoops,detail=panel('Evidence group: '+group.title,'Review the underlying evidence. Stage completion, accountable ownership and verified outcomes are not established by this report.');
  detail.id='loop-detail';detail.classList.add('loop-detail');
  detail.append(node('p','Source sessions: '+group.sessionIds.join(', '),'small'));
  detail.append(node('p',loopBasis(group)+' / '+loopFlow(group),'small'),node('p','Latest contributing run started: '+date(group.latestRunStartedAt)+'. This is not a handoff timestamp.','small'));
  detail.append(node('p','Owner: not recorded. Verified outcome: not assessed. No closure or waiting-time calculation is available.','small'));
  for(const issue of [...group.issues,...group.collectionIssues])detail.append(node('p',issue,'small'));
  for(const definition of model.stages){
    const coverage=group.coverage.find(stage=>stage.stageId===definition.id),section=node('div',undefined,'loop-stage-detail');
    section.append(node('h3',definition.title),node('p',definition.requirement,'small'));
    if(coverage.sources.length){
      section.append(node('p','Mapped artifacts available for review. Their presence does not prove this stage was completed.','small'));
      for(const source of coverage.sources)section.append(sourceButton(source.sessionId,source.path,source.line,source.workflow+' / '+source.path+' / '+source.sessionId));
    }else section.append(node('p',coverage.status==='not-assessed'?'Not assessed: the required structured outcome or decision records are not collected here.':'No stage-specific artifact evidence mapped in this snapshot. This does not establish that no work occurred.','small'));
    detail.append(section);
  }
  const context=panel('All readable sources','Transcripts and unavailable-output summaries are context only, not proof of a stage or human decision.');
  for(const source of group.sources)context.append(sourceButton(source.sessionId,source.path,source.line,source.kind+' / '+source.path+' / '+source.sessionId));
  if(!group.sources.length)context.append(node('p','No readable artifacts or transcripts were retained for this group.','empty'));
  detail.append(context);return detail;
}
function renderLoops(){
  const model=payload.report.operationalLoops,root=$('content'),groups=model.groups.filter(loopMatches);root.replaceChildren();
  $('loop-count').textContent=groups.length+' of '+model.groups.length+' evidence groups';
  const intro=panel('From agent activity to evidenced outcomes','This first version maps retained artifacts to stages for review. It does not certify completed stages or completed loops. Groups without explicit loop IDs remain candidates or separate sessions.');
  const cards=node('div',undefined,'cards');cards.append(metric('Evidence groups',groups.length,'Filtered groups, not confirmed loops'),metric('Explicit loop IDs',groups.filter(g=>g.correlationBasis==='explicit-loop-id').length,'Declared links, not verified closure'),metric('With mapped artifacts',groups.filter(g=>g.coverage.some(s=>s.status==='evidence-to-review')).length,'Artifacts to review; not completed stages'),metric('With collection gaps',groups.filter(g=>g.collectionIssues.length>0).length,'Missing collection evidence'));
  intro.append(cards);root.append(intro);
  root.append(renderLoopModel(groups));
  root.append(renderLoopPlaybooks(groups));
  root.append(renderLoopDemoSankey());
  const outcomes=panel('Outcome metrics: not yet measurable',model.unavailableMetrics.reason);
  outcomes.append(node('p','Verified risk reductions: not calculated. Closure rate: not calculated. Handoff dwell: not calculated. These are unknown, not zero.','small'));root.append(outcomes);
  const section=panel('Stage evidence coverage','Review = mapped readable artifacts, not completed work. Not observed = no mapped evidence. Not assessed = required decision or outcome records are not collected. Not every flow requires all seven stages.');
  const wrap=node('div',undefined,'scroll'),table=node('table',undefined,'loop-table'),head=node('thead'),tr=node('tr');
  for(const title of ['Evidence group / correlation','Possible entry flow',...model.stages.map(stage=>stage.title)])tr.append(node('th',title));
  head.append(tr);table.append(head);const body=node('tbody');
  for(const group of groups){
    const row=node('tr'),name=node('td'),button=node('button',group.title,'link');
    button.onclick=()=>{selectedLoopId=group.id;renderLoops();$('loop-detail').scrollIntoView({block:'start'});};
    name.append(button,node('div',group.sessionCount+' sessions / '+group.agentRunCount+' agent runs','micro'),node('div',loopBasis(group),'small'));
    if(group.collectionIssues.length)name.append(node('div','Collection gaps','small'));
    row.append(name,node('td',loopFlow(group)));
    for(const stage of group.coverage){
      const cell=node('td'),text=stage.status==='evidence-to-review'?'Review '+stage.sources.length:stage.status==='not-assessed'?'Not assessed':'Not observed';
      const badge=node('span',text,'loop-stage'+(stage.status==='evidence-to-review'?' review':''));
      badge.title=model.stages.find(s=>s.id===stage.stageId).requirement;cell.append(badge);row.append(cell);
    }
    body.append(row);
  }
  table.append(body);wrap.append(table);section.append(wrap);if(!groups.length)section.append(node('p','No evidence groups match these filters.','empty'));root.append(section);
  const selected=groups.find(group=>group.id===selectedLoopId);if(selected)root.append(renderLoopDetail(selected));
  const boundaries=panel('Correlation and evidence boundaries'),list=node('ul');for(const limitation of model.limitations)list.append(node('li',limitation));boundaries.append(list);root.append(boundaries);
}
$('page-title').textContent=loops?'Operational Loops & Outcomes':systemic?'Systemic Threat Signals':quality?'Freshness & Run Quality':'Operational Briefing';document.title='Perception | '+$('page-title').textContent;
$('page-subtitle').textContent=loops?'Trace retained evidence across the operating loop without treating agent activity as verified risk reduction.':systemic?'Connections across agentic findings that warrant a wider investigation.':quality?'Evidence age, output availability and agent execution across all workflows.':'The lay of the land from investigations, triage, intelligence and every collected agentic workflow.';
$(loops?'loops-nav':systemic?'systemic-nav':quality?'quality-nav':'briefing-nav').classList.add('active');
if(location.protocol==='file:')for(const [id,file] of [['briefing-nav','Perception-Threat-Protection.html'],['quality-nav','Perception-Assurance-Freshness.html'],['loops-nav','Perception-Operational-Loops.html'],['systemic-nav','Perception-Systemic-Threat-Signals.html'],['behavior-nav','Perception-Agent-Behavior-Analysis.html'],['environment-nav','Perception-Live-Environment.html']])$(id).href=file;
if(systemic){$('operational-filters').hidden=true;$('campaign-picker').hidden=true;$('signal-filters').hidden=false;}
if(loops){document.body.classList.add('loop-view');$('operational-filters').hidden=true;$('campaign-picker').hidden=true;$('loop-filters').hidden=false;$('export').textContent='Export coverage';}
$('snapshot').textContent='Snapshot collected '+date(insights.snapshotGeneratedAt)+' / '+insights.sessionCount+' retained sessions / '+insights.artifactCount+' artifacts';
$('scope-note').textContent=insights.scopeNote+' Security claims and recommended actions remain attributed to the source report.';
for(const [id,values] of [['workflow',insights.sessions.map(r=>r.workflow)],['agent',insights.sessions.flatMap(r=>r.agents)]]){
  for(const value of [...new Set(values)].sort()){const option=node('option',value);option.value=value;$(id).append(option);}
}
function refreshGroups(){
  const ids=new Set(baseRuns().map(r=>r.id)),picker=$('campaign');picker.replaceChildren(node('option','All incidents and inputs'));picker.options[0].value='';
  for(const group of insights.groups.filter(g=>g.sessionIds.some(id=>ids.has(id)))){const option=node('option',group.workflow+' / '+(group.title||group.latestSessionId)+' / '+(group.explicitCorrelation?group.inputTags.join(' / '):group.latestSessionId));option.value=group.id;picker.append(option);}
  if(selectedGroup&&selectedGroup.sessionIds.some(id=>ids.has(id)))picker.value=selectedGroup.id;else{selectedGroup=null;selected=null;}
}
function render(){$('group-note').textContent=(selectedGroup?(selectedGroup.explicitCorrelation?'Grouped by exact workflow and input tags':'Session-scoped; no unambiguous input correlation'):'All matching workflows and inputs')+($('agent').value?' / Session findings for runs involving the selected agent':'');if(loops)renderLoops();else if(systemic)renderSystemic();else if(quality)renderQuality();else renderBriefing();}
for(const id of ['workflow','agent','period','outcome'])$(id).onchange=()=>{refreshGroups();render();};
$('campaign').onchange=()=>{selectedGroup=insights.groups.find(c=>c.id===$('campaign').value)||null;selected=selectedGroup?insights.campaigns.find(c=>c.id===selectedGroup.id)||null:null;render();};
$('signal-search').oninput=render;$('signal-kind').onchange=render;
for(const id of ['loop-search','loop-flow','loop-evidence'])$(id)[id==='loop-search'?'oninput':'onchange']=render;
$('export').onclick=()=>{
  if(loops){
    const model=payload.report.operationalLoops;
    download({generatedAt:payload.report.generatedAt,snapshotCollectedAt:insights.snapshotGeneratedAt,mappingVersion:model.mappingVersion,filters:{search:$('loop-search').value,flow:$('loop-flow').value,evidence:$('loop-evidence').value},groups:model.groups.filter(loopMatches),stages:model.stages,unavailableMetrics:model.unavailableMetrics,limitations:model.limitations},'Perception-Operational-Loops-Coverage.json');
  }else if(systemic){
    const signals=payload.report.systemicSignals,kind=$('signal-kind').value;
    download({...signals,filters:{search:$('signal-search').value,kind},correlations:kind==='hypotheses'?[]:signals.correlations.filter(signalMatches),hypotheses:kind==='correlations'?[]:signals.hypotheses.filter(signalMatches),modelSynthesis:{...signals.modelSynthesis,hypotheses:kind==='correlations'?[]:(signals.modelSynthesis.hypotheses||[]).filter(signalMatches)}},'Perception-Systemic-Threat-Signals.json');
  }else download({asOf:insights.asOf,scopeNote:insights.scopeNote,filters:{workflow:$('workflow').value,agent:$('agent').value,period:$('period').value,outcome:$('outcome').value,groupId:selectedGroup&&selectedGroup.id},sessions:filteredRuns()},quality?'Perception-Run-Quality.json':'Perception-Operational-Briefing.json');
};
refreshGroups();
render();
</script>
